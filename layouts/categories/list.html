{{ define "main" }}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1>{{ .Title }}</h1>

    {{ if .IsHome | or (eq .Kind "section") | or (eq .Kind "taxonomy") | or (eq .Kind "term") }}
      {{ $paginator := .Paginate (.Data.Pages.ByDate.Reverse) }}
      {{ range $paginator.Pages }}
        <article>
          <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
          {{ .Description }}
        </article>
      {{ end }}
    {{ end }}

  </div>
</div>
{{ end }}
